[package]
name = "dockerlint"
version = "0.1.0"
edition = "2021"
description = "Lints a Dockerfile for common anti-patterns (unpinned base images, ADD-vs-COPY, root user, missing HEALTHCHECK, sloppy apt-get) — a hadolint alternative with no Haskell runtime"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/dockerlint"
readme = "README.md"
keywords = ["docker", "dockerfile", "lint", "hadolint", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "dockerlint"
path = "src/lib.rs"

[[bin]]
name = "dockerlint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
